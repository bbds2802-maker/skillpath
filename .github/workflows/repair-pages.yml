name: Recover stuck SkillPath Pages deployment

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-pages.yml]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  release-stale-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the stale icon deployment blocking the verified web release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/4f7e04d89232a854f62086a85a924eef221c66ff/cancel"
