name: Recover stuck SkillPath Pages deployment

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-pages.yml]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  release-stale-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safely finish recovery of the stale deployment blocking the current verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if repair_output=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/ec3faffdb1e9bfc6a17ff6022e44f09152bf5792/cancel" 2>&1); then
            echo 'The specified stale deployment was cancelled.'
          else
            case "$repair_output" in
              *"as it's finished"*) echo 'The specified deployment has already finished; recovery is complete.' ;;
              *) echo 'GitHub did not complete recovery of the specified deployment.'; exit 1 ;;
            esac
          fi
