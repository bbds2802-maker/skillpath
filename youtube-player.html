<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><title>SkillPath 课程播放器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#1d2028;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:620px;margin:auto;padding:24px 18px 50px}h1{font-size:22px;line-height:1.4}#player{width:100%;min-height:220px;aspect-ratio:16/9;background:#e8ecf4;border-radius:14px;overflow:hidden}button,a{font:inherit}button{cursor:pointer;border:1px solid #e1e5ed;border-radius:12px;background:white;padding:12px 16px;color:inherit}.controls{display:flex;gap:12px;margin:16px 0}.controls button{flex:1}#list{display:grid;gap:10px}#list button{text-align:left}#list button.active{background:#eaf0ff;border-color:#4668d7;color:#4668d7}p{color:#777f8d;font-size:14px}a{color:#4668d7}#status{min-height:24px}
</style></head><body><main><p>SkillPath · 课程资料</p><h1 id="title">正在读取课程…</h1><div id="player"></div><p id="status" role="status"></p><div class="controls"><button id="previous">上一条</button><button id="next">下一条</button></div><p><a id="external" target="_blank" rel="noopener">在 YouTube 打开当前视频 →</a></p><div id="list"></div><p>课程结束后，回到 SkillPath 记录笔记并确认完成。此网页只接收公开视频信息，不接收你的学习笔记或 API 密钥。</p></main><script>
// 从原版 ytInitPlayer / onYtStateChange / ytJumpTo 迁移，保留课程列表和自动续播。
let videos=[],index=0,player=null,started=false;
const status=document.getElementById('status');
function info(){const v=videos[index];document.getElementById('title').textContent=v.title||'课程视频';document.getElementById('external').href='https://www.youtube.com/watch?v='+v.id;status.textContent='第 '+(index+1)+' / '+videos.length+' 条'+(v.watchSecs?' · 观看前 '+Math.ceil(v.watchSecs/60)+' 分钟':'');document.querySelectorAll('#list button').forEach((b,i)=>b.classList.toggle('active',i===index));}
function jump(i){if(!videos[i])return;index=i;info();if(player&&typeof player.loadVideoById==='function'){const v=videos[index];player.loadVideoById(Object.assign({videoId:v.id,startSeconds:0},v.watchSecs?{endSeconds:v.watchSecs}:{}));}}
function next(){if(index+1<videos.length)jump(index+1);else status.textContent='本课视频已播放完，回到 SkillPath 记录收获吧。';}
window.onYouTubeIframeAPIReady=function(){if(!videos.length)return;const v=videos[index];player=new YT.Player('player',{width:'100%',height:'240',videoId:v.id,playerVars:{playsinline:1,rel:0,origin:location.origin,end:v.watchSecs||undefined},events:{onReady(){started=true;info();},onStateChange(e){if(e.data===0)next();},onError(e){status.textContent='视频暂时无法在此播放（'+e.data+'），请点下方链接在 YouTube 打开，或选择下一条。';}}});};
try{const data=JSON.parse(decodeURIComponent(location.hash.slice(1)));videos=(Array.isArray(data.videos)?data.videos:[]).slice(0,30).filter(v=>/^[A-Za-z0-9_-]{11}$/.test(v.id)).map(v=>({id:v.id,title:String(v.title||'课程视频').slice(0,100),watchSecs:Math.max(0,Math.min(10800,Number(v.watchSecs)||0))}));if(!videos.length)throw new Error('没有课程视频，请从 SkillPath 的课时页面打开。');index=Math.max(0,Math.min(videos.length-1,Number(data.index)||0));index=Math.floor(index);for(const [i,v] of videos.entries()){const b=document.createElement('button');b.textContent=(i+1)+'. '+v.title;b.onclick=()=>jump(i);document.getElementById('list').append(b);}info();const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>{status.textContent='YouTube 播放器未能加载，请检查网络，或使用下方链接观看。';};document.head.append(script);}catch(error){document.getElementById('title').textContent='无法读取课程';status.textContent=error.message;}
document.getElementById('previous').onclick=()=>jump(index-1);document.getElementById('next').onclick=next;
</script></body></html>
